<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Admin Dashboard</title>
</head>
<body>

    <h1>Election Results</h1>

    <table border="1" cellpadding="10">
        <tr>
            <th>Candidate</th>
            <th>Votes</th>
        </tr>

        {% for row in results %}
        <tr>
            <td>{{ row[0] }}</td>
            <td>{{ row[1] }}</td>
        </tr>
        {% endfor %}

    </table>

</body>
</html>
